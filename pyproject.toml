[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "differential-lab"
version = "1.0.0"
description = "Scientific numerical workflows for ODEs, boundary-value problems, difference equations, and scalar/vector PDEs, with a GUI."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Alejandro Mata Ali", email = "alejandro.mata.ali@gmail.com"}
]
keywords = ["ode", "bvp", "pde", "difference-equations", "scientific-computing", "numerical-methods", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=2.0,<3.0",
    "matplotlib>=3.10,<4.0",
    "scipy>=1.15,<2.0",
    "python-dotenv>=1.2.2,<2.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
    "pyright>=1.1,<2.0",
    "pip-audit>=2.7,<3.0",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "myst-parser>=4.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
]

[project.scripts]
differential-lab = "main_program:main"

[tool.setuptools]
py-modules = ["main_program", "pipeline"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
config = ["equations/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --basetemp=.pytest-temp"

[tool.coverage.run]
source = [
    "src/solver",
    "src/utils",
]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    ".worktrees",
    ".pytest_cache",
    ".pytest-temp",
    ".tmp",
    "pytest_temp*",
    "pytest-cache-files-*",
    "output",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
include = ["src"]
exclude = [
    ".venv",
    ".worktrees",
    ".pytest_cache",
    ".pytest-temp",
    ".tmp",
    "pytest_temp*",
    "pytest-cache-files-*",
    "output",
    "tests",
]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
pythonVersion = "3.12"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
