coupled_elliptic_system_2d:
  equation_type: vector_pde
  category: Coupled elliptic systems
  name: Manufactured Coupled Elliptic System (2D)
  formula: "Δf₀ + 0.2Δf₁ + f₁ + (1.6π² + 1)sin(πx)sin(πy) = 0; 0.2Δf₀ + Δf₁ + f₀ - (1.6π² + 1)sin(πx)sin(πy) = 0"
  description: "A two-component strongly elliptic system with off-diagonal second-order
    and zero-order coupling. With homogeneous shared Dirichlet boundaries, the exact
    default solution is f0 = sin(pi*x)sin(pi*y), f1 = -sin(pi*x)sin(pi*y)."
  variables:
  - x
  - y
  order: 2
  parameters: {}
  vector_expressions:
  - "fxx[0] + fyy[0] + 0.2*fxx[1] + 0.2*fyy[1] + f[1] + (1.6*pi**2 + 1)*sin(pi*x)*sin(pi*y)"
  - "0.2*fxx[0] + 0.2*fyy[0] + fxx[1] + fyy[1] + f[0] - (1.6*pi**2 + 1)*sin(pi*x)*sin(pi*y)"
  vector_components: 2
  default_initial_conditions: []
  default_domain:
  - 0.0
  - 1.0
  - 0.0
  - 1.0
